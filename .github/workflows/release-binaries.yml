name: Custom Windows x64 portable
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: custom-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout selected variant
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify build manifest
        id: manifest
        run: |
          $manifest = Get-Content custom-build.json -Raw | ConvertFrom-Json
          git merge-base --is-ancestor $manifest.reference HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Build-95 reference missing' }
          if ($manifest.variant -notin 'A', 'B') { throw 'Select a custom variant branch' }
          "variant=$($manifest.variant)" | Add-Content $env:GITHUB_OUTPUT
      - name: Setup runner MSVC x64
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Install Qt on the runner
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: false
      - name: Install official Vulkan SDK on the runner
        shell: powershell
        run: ./tools/windows/install-vulkan-sdk.ps1
      - name: Record runner tools
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          cmake --version | Tee-Object diagnostics/cmake.txt
          ninja --version | Tee-Object diagnostics/ninja.txt
          cl 2>&1 | Out-File diagnostics/msvc.txt
          glslangValidator --version | Tee-Object diagnostics/glslang.txt
          $global:LASTEXITCODE = 0
      - name: Configure Release with tests
        run: |
          $variant = (Get-Content custom-build.json -Raw | ConvertFrom-Json).variant
          cmake -S . -B build/release -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=ON -DYUZU_TESTS=ON -DENABLE_QT=ON `
            -DYUZU_CMD=ON -DYUZU_ROOM=OFF -DYUZU_ROOM_STANDALONE=OFF `
            -DYUZU_USE_BUNDLED_QT=OFF -DYUZU_USE_BUNDLED_SDL3=ON `
            -DENABLE_UPDATE_CHECKER=OFF -DUSE_DISCORD_PRESENCE=OFF `
            -DENABLE_WERROR=ON `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            "-DLICHII_BUILD_TAG=custom-$variant-$env:GITHUB_RUN_NUMBER" `
            -DLICHII_BUILD_PLATFORM=windows-x86_64
          if ($LASTEXITCODE -ne 0) { throw 'Configure failed' }
      - name: Build application and all tests
        run: |
          cmake --build build/release --parallel 3
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
      - name: Run registered tests
        run: |
          ctest --test-dir build/release --output-on-failure --no-tests=error --timeout 300 2>&1 | Tee-Object diagnostics/ctest.txt
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed; portable package withheld' }
      - name: Package and validate standalone ZIP
        run: ./tools/custom/package.ps1
      - name: Upload portable archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lichii-portable-${{ steps.manifest.outputs.variant }}-${{ github.sha }}
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            diagnostics/
            build/release/Testing/Temporary/
            build/release/CMakeCache.txt
            build/release/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 14
