name: Custom F Build117 Windows x64
on:
  workflow_dispatch:
    inputs:
      reference_only:
        description: Validate only the pinned official117 reference; never publish a F archive
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: custom-f-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_BASEDIR: ${{ github.workspace }}/source
      CCACHE_NOHASHDIR: true
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout F build orchestration
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify pinned build117 manifest
        run: |
          $m = Get-Content custom-build.json -Raw | ConvertFrom-Json
          if ($m.variant -ne 'F' -or $m.reference -ne '89440b29a90708c0fefc126b2bd8c7a64a996bdd') { throw 'Incorrect F reference' }
          git merge-base --is-ancestor $m.reference HEAD
          if ($LASTEXITCODE -ne 0) { throw 'F must contain the complete build117 history' }
          New-Item -ItemType Directory -Force diagnostics | Out-Null
      - name: Setup MSVC SDK x64
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Install official pinned LLVM on runner
        run: ./tools/windows/install-llvm.ps1
      - name: Install official Qt on runner
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true
      - name: Install pinned compiler cache on runner
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-windows-x86_64.zip
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash -ne '6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84') { throw 'ccache checksum mismatch' }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP 'ccache-4.14.2-windows-x86_64' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Install official Vulkan SDK on runner
        shell: powershell
        run: ./tools/windows/install-vulkan-sdk.ps1
      - name: Restore dependencies and compiler objects
        id: compiler-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .ccache
            .cache/cpm
          key: custom-f-clang22-qt683-${{ runner.os }}-${{ hashFiles('lichii-windows.profdata') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            custom-f-clang22-qt683-${{ runner.os }}-${{ hashFiles('lichii-windows.profdata') }}-
      - name: Record runner tool versions
        run: |
          cmake --version | Tee-Object diagnostics/cmake.txt
          ninja --version | Tee-Object diagnostics/ninja.txt
          & "$env:LLVM_ROOT/bin/clang-cl.exe" --version | Tee-Object diagnostics/clang.txt
          glslangValidator --version | Tee-Object diagnostics/glslang.txt
          ccache --version | Tee-Object diagnostics/ccache-version.txt
      - name: Checkout exact official build117 source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zortos293/Lichii
          ref: 89440b29a90708c0fefc126b2bd8c7a64a996bdd
          path: source
          persist-credentials: false
          fetch-depth: 0
      - name: Build and test official117 reference
        run: ./tools/custom/build-windows.ps1 -Label official117 -BuildDirectory build-reference
      - name: Validate official117 Qt and DLL loading
        run: ./tools/custom/package.ps1 -BuildDirectory build-reference -Label official117 -ValidationOnly
      - name: Free reference build space after validation
        run: |
          Remove-Item build-reference -Recurse -Force
          Remove-Item stage-official117 -Recurse -Force
      - name: Checkout exact Custom F source
        if: ${{ !inputs.reference_only }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
          fetch-depth: 0
      - name: Build and test Custom F
        if: ${{ !inputs.reference_only }}
        run: ./tools/custom/build-windows.ps1 -Label F -BuildDirectory build/release
      - name: Package and validate portable F
        if: ${{ !inputs.reference_only }}
        run: ./tools/custom/package.ps1 -BuildDirectory build/release -Label F
      - name: Upload validated portable F ZIP
        if: ${{ !inputs.reference_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Lichii-Custom-F-Build117-AMD-Win64-${{ github.sha }}
          path: |
            artifacts/Lichii-Custom-F-Build117-AMD-Win64.zip
            artifacts/Lichii-Custom-F-Build117-AMD-Win64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Save compiler objects including failed builds
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .ccache
            .cache/cpm
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Upload actual validation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: F-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            diagnostics/
            build-reference/Testing/Temporary/
            build-reference/CMakeCache.txt
            build/release/Testing/Temporary/
            build/release/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 14
